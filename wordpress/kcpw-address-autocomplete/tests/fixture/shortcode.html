<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shortcode (stand-in page for the plugin's browser tests)</title><link rel="stylesheet" href="baseline.css"><link rel="stylesheet" href="kcpw-aa.css"></head><body><main><h1>Order form</h1><form id="order" action="#" novalidate><div class="kcpw-aa-sc" id="kcpw-aa-sc-1"><label for="kcpw-aa-sc-1-address">Home address</label><input type="text" class="kcpw-aa-sc__input" id="kcpw-aa-sc-1-address" name="home" autocomplete="street-address"><input type="hidden" id="kcpw-aa-sc-1-address2" name="home_line2"><input type="hidden" id="kcpw-aa-sc-1-city" name="home_city"><input type="hidden" id="kcpw-aa-sc-1-state" name="home_state"><input type="hidden" id="kcpw-aa-sc-1-postcode" name="home_postcode"><input type="hidden" id="kcpw-aa-sc-1-country" name="home_country"></div><div class="kcpw-aa-sc" id="kcpw-aa-sc-2"><label for="kcpw-aa-sc-2-address">Work address</label><input type="text" class="kcpw-aa-sc__input" id="kcpw-aa-sc-2-address" name="work" autocomplete="street-address" required><label for="kcpw-aa-sc-2-address2">Apartment, suite (optional)</label><input type="text" id="kcpw-aa-sc-2-address2" name="work_line2" autocomplete="off"><label for="kcpw-aa-sc-2-city">City</label><input type="text" id="kcpw-aa-sc-2-city" name="work_city" autocomplete="off"><label for="kcpw-aa-sc-2-state">State or province</label><input type="text" id="kcpw-aa-sc-2-state" name="work_state" autocomplete="off"><label for="kcpw-aa-sc-2-postcode">Postal code</label><input type="text" id="kcpw-aa-sc-2-postcode" name="work_postcode" autocomplete="off"><label for="kcpw-aa-sc-2-country">Country</label><input type="text" id="kcpw-aa-sc-2-country" name="work_country" autocomplete="off"></div><p><button type="submit" id="send">Send</button></p></form><pre id="posted" hidden></pre></main><script>document.getElementById('order').addEventListener('submit', function (e) { e.preventDefault(); var d = new FormData(e.target), o = {}; d.forEach(function (v, k) { o[k] = v; }); var p = document.getElementById('posted'); p.textContent = JSON.stringify(o); p.hidden = false; });</script><script src="kcpw-aa.js" defer></script></body></html>
