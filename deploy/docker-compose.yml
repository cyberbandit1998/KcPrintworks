# KCPrintWorks storefront on the VPS: /opt/kcprintworks-nextjs
#
# - Pulls a published image from GHCR; nothing is built on the server.
# - Joins the EXISTING external Docker network "proxy" so Nginx Proxy Manager can reach it by container name.
# - Port 3000 is only `expose`d to that network. There is no `ports:` entry, so nothing is published on the VPS.
# - It does not create, modify, or depend on WordPress, MariaDB, or Nginx Proxy Manager.
# - With CATALOG_SOURCE=woo it READS products from the WooCommerce REST API (GET only, a Read-only key). It never writes
#   to WooCommerce and never talks to Stripe. Checkout is OFF unless the .env turns it on (CHECKOUT_ENABLED, staging only).
#
# Settings come from the .env file next to this one (see .env.example). IMAGE_TAG is required on purpose: the
# server always runs an explicit, known image, never "whatever latest is today".
name: kcprintworks-nextjs

services:
  kcprintworks-nextjs:
    image: ghcr.io/${GHCR_OWNER:-cyberbandit1998}/kcprintworks-nextjs:${IMAGE_TAG:?Set IMAGE_TAG in .env, for example sha-1a2b3c4}
    container_name: kcprintworks-nextjs
    restart: unless-stopped
    init: true
    stop_grace_period: 20s

    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: '1'
      # The staging/production behavior (noindex, canonical URLs, image hosts) was fixed when the image was built.
      # These two only label the environment; they cannot make a staging image indexable.
      SITE_ENV: ${SITE_ENV:-staging}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # fixtures = placeholder products (default, needs nothing). woo = the real WooCommerce catalog, read-only.
      CATALOG_SOURCE: ${CATALOG_SOURCE:-fixtures}
      # Used only when CATALOG_SOURCE=woo. Values come from the .env next to this file (chmod 600), never from the image.
      WC_BASE_URL: ${WC_BASE_URL:-}
      WC_CONSUMER_KEY: ${WC_CONSUMER_KEY:-}
      WC_CONSUMER_SECRET: ${WC_CONSUMER_SECRET:-}
      # How often (seconds) the catalog is re-read in the background, and the secret that signs refresh requests.
      CATALOG_REVALIDATE_SECONDS: ${CATALOG_REVALIDATE_SECONDS:-120}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      # Checkout (Step 3). OFF unless CHECKOUT_ENABLED=true AND the shop address and handoff secret are set. It can never be
      # on in a production build. The secret must equal KCPW_HANDOFF_SECRET in the shop's wp-config.php. Test mode only.
      CHECKOUT_ENABLED: ${CHECKOUT_ENABLED:-false}
      # The shop address is KCPW_API_URL, or KCPW_SHOP_URL, or (when both are empty) WC_BASE_URL above.
      KCPW_API_URL: ${KCPW_API_URL:-}
      KCPW_SHOP_URL: ${KCPW_SHOP_URL:-}
      KCPW_HANDOFF_SECRET: ${KCPW_HANDOFF_SECRET:-}
      # The cart's free-shipping progress bar (display only; WooCommerce decides the shipping). Empty = the default, $40.00; "off" hides
      # the bar. The number must match the minimum of the Free Shipping method in WooCommerce. See docs/FREE-SHIPPING.md.
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-}
      FREE_SHIPPING_BEFORE_DISCOUNTS: ${FREE_SHIPPING_BEFORE_DISCOUNTS:-false}
      # Keep V8's heap below the container's memory limit so it collects garbage instead of being OOM-killed.
      NODE_OPTIONS: --max-old-space-size=320

    expose:
      - '3000'
    networks:
      - proxy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # Sized for a 1 CPU / 4 GB host that also runs WordPress, MariaDB, and Nginx Proxy Manager.
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
          pids: 200
        reservations:
          memory: 128M

    # Hardening: nothing in the container needs to write outside these paths or hold extra privileges.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/storefront/.next/cache:size=128m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  proxy:
    external: true
