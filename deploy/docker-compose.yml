# KCPrintWorks storefront on the VPS: /opt/kcprintworks-nextjs
#
# - Pulls a published image from GHCR; nothing is built on the server.
# - Joins the EXISTING external Docker network "proxy" so Nginx Proxy Manager can reach it by container name.
# - Port 3000 is only `expose`d to that network. There is no `ports:` entry, so nothing is published on the VPS.
# - It does not create, modify, or depend on WordPress, MariaDB, or Nginx Proxy Manager.
# - With CATALOG_SOURCE=woo it READS products from the WooCommerce REST API (GET only, a Read-only key). It never writes
#   to WooCommerce and never talks to Stripe. Checkout is OFF unless the .env turns it on (CHECKOUT_ENABLED).
# - This file is the STAGING instance. A PRODUCTION instance runs beside it from its own directory with
#   docker-compose.production.yml (a different project, container and service name), so the two never share a name or a DNS alias.
#   See docs/CHECKOUT-PRODUCTION.md.
#
# Settings come from the .env file next to this one (see .env.example). IMAGE_TAG is required on purpose: the
# server always runs an explicit, known image, never "whatever latest is today".
name: kcprintworks-nextjs

services:
  kcprintworks-nextjs:
    image: ghcr.io/${GHCR_OWNER:-cyberbandit1998}/kcprintworks-nextjs:${IMAGE_TAG:?Set IMAGE_TAG in .env, for example sha-1a2b3c4}
    container_name: kcprintworks-nextjs
    restart: unless-stopped
    init: true
    stop_grace_period: 20s

    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: '1'
      # The staging/production behavior (noindex, canonical URLs, image hosts) was fixed when the image was built.
      # These two only label the environment; they cannot make a staging image indexable.
      SITE_ENV: ${SITE_ENV:-staging}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # fixtures = placeholder products (default, needs nothing). woo = the real WooCommerce catalog, read-only.
      CATALOG_SOURCE: ${CATALOG_SOURCE:-fixtures}
      # Used only when CATALOG_SOURCE=woo. Values come from the .env next to this file (chmod 600), never from the image.
      WC_BASE_URL: ${WC_BASE_URL:-}
      WC_CONSUMER_KEY: ${WC_CONSUMER_KEY:-}
      WC_CONSUMER_SECRET: ${WC_CONSUMER_SECRET:-}
      # How often (seconds) the catalog is re-read in the background, and the secret that signs refresh requests.
      CATALOG_REVALIDATE_SECONDS: ${CATALOG_REVALIDATE_SECONDS:-120}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      # Checkout. OFF unless CHECKOUT_ENABLED=true AND the shop address and handoff secret are set. A staging image only hands a cart to a
      # shop that reports Stripe TEST mode; a production image (docker-compose.production.yml) has stricter rules (docs/CHECKOUT-PRODUCTION.md).
      # The secret must equal KCPW_HANDOFF_SECRET in the shop's wp-config.php.
      CHECKOUT_ENABLED: ${CHECKOUT_ENABLED:-false}
      # The shop address is KCPW_API_URL, or KCPW_SHOP_URL, or (when both are empty) WC_BASE_URL above.
      KCPW_API_URL: ${KCPW_API_URL:-}
      KCPW_SHOP_URL: ${KCPW_SHOP_URL:-}
      KCPW_HANDOFF_SECRET: ${KCPW_HANDOFF_SECRET:-}
      # The cart's free-shipping progress bar (display only; WooCommerce decides the shipping). Empty = the default, $40.00; "off" hides
      # the bar. The number must match the minimum of the Free Shipping method in WooCommerce. See docs/FREE-SHIPPING.md.
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-}
      FREE_SHIPPING_BEFORE_DISCOUNTS: ${FREE_SHIPPING_BEFORE_DISCOUNTS:-false}
      # Header links and category browsing. The defaults match the shop's WooCommerce categories (slugs game-cases and
      # personalized-gifts); set these only if a slug changes. A slug or a numeric category id. See docs/WORDPRESS-CONTENT-AND-REVIEWS.md.
      NAV_GAME_CASES: ${NAV_GAME_CASES:-}
      NAV_PERSONALIZED_GIFTS: ${NAV_PERSONALIZED_GIFTS:-}
      HIDDEN_CATEGORY_SLUGS: ${HIDDEN_CATEGORY_SLUGS:-}
      # The blog, Our Story, and Contact are read from WordPress (public posts and pages, GET only, no key). WP_BASE_URL defaults to WC_BASE_URL.
      WP_BASE_URL: ${WP_BASE_URL:-}
      OUR_STORY_SLUG: ${OUR_STORY_SLUG:-}
      CONTACT_PAGE_SLUG: ${CONTACT_PAGE_SLUG:-}
      BLOG_PER_PAGE: ${BLOG_PER_PAGE:-}
      # Customer reviews are shown from WooCommerce's approved reviews. HOME_REVIEWS_MIN_RATING (1-5, default 1) is the lowest rating
      # the home page shows. Writing a review is OFF unless REVIEWS_SUBMIT_ENABLED=true (needs the kcpw-core plugin 0.2.0 or newer and
      # the checkout settings above for the shop address and secret); each review is saved as PENDING and approved by a person in WordPress.
      HOME_REVIEWS_MIN_RATING: ${HOME_REVIEWS_MIN_RATING:-}
      REVIEWS_SUBMIT_ENABLED: ${REVIEWS_SUBMIT_ENABLED:-false}
      REVIEWS_RATE_LIMIT: ${REVIEWS_RATE_LIMIT:-}
      REVIEWS_RATE_LIMIT_ALL: ${REVIEWS_RATE_LIMIT_ALL:-}
      # Custom quotes (/custom-orders/). Taking REQUESTS is OFF unless QUOTES_ENABLED=true (needs the kcpw-quotes plugin on the shop and the
      # shop address and KCPW_HANDOFF_SECRET above). Approving and paying a quote IS checkout, so it also needs CHECKOUT_ENABLED=true and
      # passes the same per-press shop checks. Limits are per hour; the time zone decides "today" for deadlines. docs/CUSTOM-QUOTES.md.
      QUOTES_ENABLED: ${QUOTES_ENABLED:-false}
      QUOTES_TIMEZONE: ${QUOTES_TIMEZONE:-}
      QUOTES_RATE_LIMIT: ${QUOTES_RATE_LIMIT:-}
      QUOTES_RATE_LIMIT_ALL: ${QUOTES_RATE_LIMIT_ALL:-}
      QUOTES_APPROVE_RATE_LIMIT: ${QUOTES_APPROVE_RATE_LIMIT:-}
      QUOTES_APPROVE_RATE_LIMIT_ALL: ${QUOTES_APPROVE_RATE_LIMIT_ALL:-}
      # Extra search words: groups of words that mean the same thing, e.g. "mtg=magic the gathering;ttr=ticket to ride". docs/PRODUCT-SEARCH.md.
      SEARCH_SYNONYMS: ${SEARCH_SYNONYMS:-}
      # Keep V8's heap below the container's memory limit so it collects garbage instead of being OOM-killed.
      NODE_OPTIONS: --max-old-space-size=320

    expose:
      - '3000'
    networks:
      - proxy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # Sized for a 1 CPU / 4 GB host that also runs WordPress, MariaDB, and Nginx Proxy Manager.
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
          pids: 200
        reservations:
          memory: 128M

    # Hardening: nothing in the container needs to write outside these paths or hold extra privileges.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/storefront/.next/cache:size=128m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  proxy:
    external: true
