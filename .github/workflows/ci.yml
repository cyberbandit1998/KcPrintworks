name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests, build, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Guards (no Etsy or sync-service code, secret-shaped strings)
        run: npm run guard
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Script tests
        run: npm run test:scripts
      - name: WordPress plugin (PHP lint and tests)
        run: npm run test:php
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/storefront
      - name: End-to-end and accessibility tests
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Build the kcpw-core plugin package
        run: npm run build:core-plugin
      - name: Upload the kcpw-core plugin package
        uses: actions/upload-artifact@v4
        with:
          name: kcpw-core-plugin
          path: dist/kcpw-core.zip
          retention-days: 30
      - name: Build the kcpw-checkout-style plugin package
        run: npm run build:checkout-style
      - name: Upload the kcpw-checkout-style plugin package
        uses: actions/upload-artifact@v4
        with:
          name: kcpw-checkout-style-plugin
          path: dist/kcpw-checkout-style.zip
          retention-days: 30
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/storefront/test-results
          retention-days: 7
