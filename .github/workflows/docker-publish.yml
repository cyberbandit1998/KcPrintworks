name: Publish Docker image

# Builds the storefront image, smoke-tests it, and publishes it to GitHub Container Registry (GHCR):
#   ghcr.io/<owner>/kcprintworks-nextjs:<tag>
#
# Tags:  sha-<7 chars>   every build (the one to deploy and to roll back to; immutable in practice)
#        <branch>        moving pointer per branch
#        latest          default branch only
#        <version>       when a v* git tag is pushed
# A production build (manual run only) appends "-production" to every tag and never gets "latest", and bakes in the production
# address (the site_url input, https://kcprintworks.com unless changed). The staging build uses the SITE_URL repository variable.
#
# The image that is smoke-tested is the exact image that is pushed (it is tagged and pushed from the local
# daemon, not rebuilt), so a failing smoke test publishes nothing.

on:
  push:
    branches: [main, claude/hopeful-hamilton-lq8pw6]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      site_env:
        description: 'staging = noindex (default, safe). production = indexable; use only when approved.'
        type: choice
        options: [staging, production]
        default: staging
      site_url:
        description: 'production only: the public address written into the image (NEXT_PUBLIC_SITE_URL). https, no path. Empty = https://kcprintworks.com.'
        type: string
        default: ''

# Least privilege by default. The publish job below asks for `packages: write` explicitly, which is the
# only extra permission needed to push to GHCR with the built-in GITHUB_TOKEN (no personal token stored).
permissions:
  contents: read

concurrency:
  # One group per environment, so a production build started while a staging build runs (or the other way round) does not cancel it.
  group: docker-publish-${{ github.ref }}-${{ inputs.site_env || 'staging' }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build, smoke-test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      SITE_ENV: ${{ inputs.site_env || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and settings
        id: vars
        env:
          # Optional repository variable (Settings > Secrets and variables > Actions > Variables). Staging builds only.
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          SITE_URL_INPUT: ${{ inputs.site_url }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"            # GHCR requires lowercase
          echo "image=ghcr.io/${owner}/kcprintworks-nextjs" >> "$GITHUB_OUTPUT"
          if [ "$SITE_ENV" = "production" ]; then
            # The address a production image is built with is the address it will answer to and return shoppers to. It must be a plain
            # https origin (no path, no credentials, not a local or numeric host) or checkout would refuse to start (lib/checkout.ts).
            site_url="${SITE_URL_INPUT:-https://kcprintworks.com}"
            site_url="${site_url%/}"
            if ! printf '%s' "$site_url" | grep -Eq '^https://([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$'; then
              echo "::error::site_url must be an https address with no path, for example https://kcprintworks.com (got: $site_url)"; exit 1
            fi
            echo "suffix=-production" >> "$GITHUB_OUTPUT"
          else
            site_url="${SITE_URL_VAR:-http://localhost:3000}"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi
          echo "site_url=${site_url}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: |
            latest=false
            suffix=${{ steps.vars.outputs.suffix }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch && env.SITE_ENV == 'staging' }}
          labels: |
            org.opencontainers.image.title=kcprintworks-nextjs
            org.opencontainers.image.description=KCPrintWorks storefront (${{ env.SITE_ENV }} build)

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: kcprintworks-nextjs:smoke
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_ENV=${{ env.SITE_ENV }}
            NEXT_PUBLIC_SITE_URL=${{ steps.vars.outputs.site_url }}
            IMAGE_HOSTS=${{ vars.IMAGE_HOSTS }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          # Faster health probes than production, same command (it comes from the Dockerfile).
          docker run -d --name smoke -p 127.0.0.1:3000:3000 \
            --health-interval=3s --health-start-period=5s --health-retries=3 \
            kcprintworks-nextjs:smoke
          ./scripts/docker-smoke.sh http://127.0.0.1:3000 "$SITE_ENV" smoke || { docker logs smoke; exit 1; }
          for _ in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "container health: $status"
          [ "$status" = "healthy" ] || { docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: A staging image cannot be made indexable from outside, and a read-only container runs without WooCommerce
        if: env.SITE_ENV == 'staging'
        run: |
          # Same image, hostile environment: SITE_ENV=production at run time must NOT change what the image was built to be,
          # and the container runs read-only with no capabilities exactly like the compose file does.
          docker run -d --name hostile -p 127.0.0.1:3001:3000 --read-only --cap-drop ALL \
            --tmpfs /tmp --tmpfs /app/apps/storefront/.next/cache:uid=1000,gid=1000 \
            -e SITE_ENV=production -e CATALOG_SOURCE=fixtures kcprintworks-nextjs:smoke
          ./scripts/docker-smoke.sh http://127.0.0.1:3001 staging hostile || { docker logs hostile; exit 1; }
          docker rm -f hostile

      - name: Checkout follows the container's environment, with no rebuild
        if: env.SITE_ENV == 'staging'
        run: |
          # The same image three ways: no checkout settings, checkout switched on without the shared secret, and everything set
          # (the shop address is deliberately unreachable; the secret is a throwaway value made here). Only the environment differs.
          run_case() {
            name="$1"; expect="$2"; shift 2
            docker run -d --name "$name" -p 127.0.0.1:3002:3000 "$@" kcprintworks-nextjs:smoke
            ./scripts/docker-smoke-checkout.sh http://127.0.0.1:3002 "$expect" || { docker logs "$name"; exit 1; }
            docker rm -f "$name"
          }
          run_case co-off off
          run_case co-incomplete incomplete -e CHECKOUT_ENABLED=true -e KCPW_SHOP_URL=https://shop.invalid
          run_case co-on on -e CHECKOUT_ENABLED=true -e KCPW_SHOP_URL=https://shop.invalid \
            -e "KCPW_HANDOFF_SECRET=$(openssl rand -hex 24)"

      - name: A production image is fixed at build time, and checkout follows the container's environment
        if: env.SITE_ENV == 'production'
        env:
          EXPECT_SITE_URL: ${{ steps.vars.outputs.site_url }}
        run: |
          # The same production image, started with different environments. The shop address is deliberately unreachable and every
          # key/secret is a throwaway made here; only whether checkout is switched on, and under which rules, is checked.
          run_case() {
            name="$1"; expect="$2"; word="$3"; shift 3
            docker run -d --name "$name" -p 127.0.0.1:3002:3000 "$@" kcprintworks-nextjs:smoke
            ./scripts/docker-smoke-checkout.sh http://127.0.0.1:3002 "$expect" "$word" || { docker logs "$name"; exit 1; }
            docker rm -f "$name"
          }
          secret="$(openssl rand -hex 24)"
          woo="-e CATALOG_SOURCE=woo -e WC_BASE_URL=https://shop.invalid -e WC_CONSUMER_KEY=ck_throwaway -e WC_CONSUMER_SECRET=cs_throwaway"
          run_case pco-off off ""
          run_case pco-incomplete incomplete "" $woo -e CHECKOUT_ENABLED=true -e KCPW_API_URL=https://shop.invalid
          run_case pco-sample misconfigured CATALOG_SOURCE -e CHECKOUT_ENABLED=true -e KCPW_API_URL=https://shop.invalid -e "KCPW_HANDOFF_SECRET=$secret"
          run_case pco-http misconfigured "must be https" $woo -e CHECKOUT_ENABLED=true -e KCPW_API_URL=http://shop.invalid -e "KCPW_HANDOFF_SECRET=$secret"
          # Hostile environment on top of valid settings: the build's own environment and address must win.
          run_case pco-on on "$EXPECT_SITE_URL" $woo -e CHECKOUT_ENABLED=true -e KCPW_API_URL=https://shop.invalid \
            -e "KCPW_HANDOFF_SECRET=$secret" -e SITE_ENV=staging -e NEXT_PUBLIC_SITE_URL=http://evil.example

      - name: The free-shipping setting follows the container's environment, with no rebuild
        if: env.SITE_ENV == 'staging'
        run: |
          # Same image, three environments: the default ($40.00), a custom amount, and switched off. The cart page is rendered per
          # request and carries the rule it was given as a prop, so this reads it from the page.
          fs_case() {
            name="$1"; expect="$2"; shift 2
            docker run -d --name "$name" -p 127.0.0.1:3003:3000 "$@" kcprintworks-nextjs:smoke
            for _ in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3003/api/health/ 2>/dev/null && break; sleep 1; done
            curl -fsS http://127.0.0.1:3003/cart/ | grep -Eq "$expect" || { echo "free-shipping case $name: expected $expect"; docker logs "$name"; exit 1; }
            docker rm -f "$name"
          }
          fs_case fs-default 'thresholdMinor[\\]*":4000'
          fs_case fs-custom 'thresholdMinor[\\]*":2550' -e FREE_SHIPPING_THRESHOLD=25.50
          fs_case fs-off 'freeShipping[\\]*":null' -e FREE_SHIPPING_THRESHOLD=off

      - name: Publish the tested image to GHCR
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag kcprintworks-nextjs:smoke "$tag"
            docker push "$tag"
          done
          first=$(echo "$TAGS" | head -n1)
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$first")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published to GHCR"
            echo
            echo "Environment: \`$SITE_ENV\`"
            echo
            echo "Public address built in: \`${{ steps.vars.outputs.site_url }}\`"
            echo
            echo "Tags:"
            for tag in $TAGS; do echo "- \`$tag\`"; done
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Deploy on the VPS: \`./deploy.sh sha-${GITHUB_SHA::7}${{ steps.vars.outputs.suffix }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
